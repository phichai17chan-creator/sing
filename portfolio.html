<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT-FLOW | พอร์ตโฟลิโอ ม.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --border-color: rgba(255, 255, 255, 0.1); --accent-blue: #38bdf8; --accent-purple: #c084fc; --accent-rose: #fb7185; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        .navbar { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); padding: 16px 6%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 16px; list-style: none; }
        .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 8px 14px; border-radius: 10px; transition: all 0.2s ease; }
        .nav-links a.active, .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); }

        .container { max-width: 1000px; margin: 28px auto; padding: 0 20px; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; }
        
        .port-form { display: grid; grid-template-columns: 1fr 1fr 140px; gap: 10px; margin-bottom: 20px; }
        .input-ctrl { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 10px; outline: none; }
        .btn-add { background: linear-gradient(135deg, var(--accent-purple), #9333ea); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; grid-column: span 3; }

        .port-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand"><i class="fa-solid fa-graduation-cap"></i> STUDENT-FLOW</a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> หน้าแรก</a></li>
            <li><a href="portfolio.html" class="active"><i class="fa-solid fa-folder-open"></i> ผลงาน TCAS1</a></li>
            <li><a href="timer.html"><i class="fa-solid fa-stopwatch"></i> จับเวลา/บทเรียน</a></li>
            <li><a href="university.html"><i class="fa-solid fa-building-columns"></i> เป้าหมายคณะ</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h2 style="margin-bottom:16px;"><i class="fa-solid fa-award" style="color:var(--accent-purple);"></i> บันทึกผลงาน & กิจกรรมสะสมใส่ พอร์ตโฟลิโอ</h2>
            <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:20px;">รวบรวมเกียรติบัตร ค่าย วิชาการ งานจิตอาสา ไว้ใช้ยื่น TCAS รอบ 1</p>

            <div class="port-form">
                <input type="text" id="title" class="input-ctrl" placeholder="ชื่อกิจกรรม / เกียรติบัตร">
                <select id="category" class="input-ctrl">
                    <option value="ค่ายวิชาการ">ค่ายวิชาการ</option>
                    <option value="การแข่งขัน / รางวัล">การแข่งขัน / รางวัล</option>
                    <option value="จิตอาสา / กิจกรรมโรงเรียน">จิตอาสา / กิจกรรมโรงเรียน</option>
                    <option value="ผลงานวิชาการ / โครงงาน">ผลงานวิชาการ / โครงงาน</option>
                </select>
                <input type="date" id="date" class="input-ctrl">
                <button class="btn-add" onclick="addPort()"><i class="fa-solid fa-plus"></i> เพิ่มเข้าคลังผลงาน</button>
            </div>

            <div id="portList"></div>
        </div>
    </div>

    <script>
        let ports = JSON.parse(localStorage.getItem('m5_ports')) || [];

        function renderPort() {
            localStorage.setItem('m5_ports', JSON.stringify(ports));
            const list = document.getElementById('portList');
            list.innerHTML = ports.length === 0 ? '<p style="color:var(--text-sub); text-align:center; padding:20px;">ยังไม่มีผลงานที่บันทึกไว้</p>' : '';
            ports.forEach((item, index) => {
                list.innerHTML += `
                    <div class="port-card">
                        <div>
                            <span class="badge">${item.category}</span>
                            <h4 style="margin-top:6px;">${item.title}</h4>
                            <p style="font-size:0.75rem; color:var(--text-sub);">วันที่ทำกิจกรรม: ${item.date}</p>
                        </div>
                        <button onclick="delPort(${index})" style="background:none; border:none; color:var(--accent-rose); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addPort() {
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            if(!title || !date) return alert('กรุณากรอกข้อมูลให้ครบครับ');
            ports.push({ title, category, date });
            document.getElementById('title').value = '';
            renderPort();
        }

        function delPort(i) { ports.splice(i, 1); renderPort(); }
        renderPort();
    </script>
</body>
</html>
